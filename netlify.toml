# Netlify config for this static, no-build site (see package.json).
# No [build] section is defined here deliberately — this repo has no
# build step, and Netlify's own dashboard build settings for this site
# are left untouched by this file.

# The homepage is authored as Homepage.dc.html (this site's "Claude
# Design" canvas pages are all named PageName.dc.html rather than
# index.html), so Netlify's default "serve index.html at /" has nothing
# to serve at the root and shows its default 404. This rewrite (status
# 200, not a redirect) makes "/" transparently serve Homepage.dc.html
# while the visible URL stays "/".
[[redirects]]
  from = "/"
  to = "/Homepage.dc.html"
  status = 200

# Clean-URL rewrites for the 10 topic hub pages, ahead of the real
# domain eventually wanting pretty URLs instead of Topic-Name.dc.html.
# Slugs match each topic's own folder name (divorce/, investing/, etc.)
# used throughout the codebase (see scripts/article-images/lib/config.mjs
# TOPICS), so there's no separate naming scheme to keep in sync.
# Each pair covers the path with and without a trailing slash.
[[redirects]]
  from = "/divorce"
  to = "/divorce/Topic-Divorce.dc.html"
  status = 200
[[redirects]]
  from = "/divorce/"
