# Deliberately NOT included: clean URLs for individual articles.
# Several articles exist at two paths (inside their topic folder, and
# duplicated at the repo root from an earlier migration — see PR #26),
# and picking a "clean" URL for each would mean silently choosing which
# copy is canonical. That's a real decision, not a mechanical mapping,
# so it's left for a follow-up once that's settled rather than guessed
# here.

# Cache the favicon/manifest files for a day. Short enough that a future
# redesign of the icon rolls out same-day, long enough to avoid refetching
# them on every page view.
[[headers]]
  for = "/favicon.ico"
  [headers.values]
    Cache-Control = "public, max-age=86400"
[[headers]]
  for = "/favicon.svg"
  [headers.values]
    Cache-Control = "public, max-age=86400"
[[headers]]
  for = "/favicon-16x16.png"
  [headers.values]
    Cache-Control = "public, max-age=86400"
[[headers]]
  for = "/favicon-32x32.png"
  [headers.values]
    Cache-Control = "public, max-age=86400"
[[headers]]
  for = "/apple-touch-icon.png"
  [headers.values]
    Cache-Control = "public, max-age=86400"
[[headers]]
  for = "/icon-192.png"
