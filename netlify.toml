# Deliberately NOT included: clean URLs for individual articles. Each
# article now lives at exactly one real path (inside its topic folder) --
# the repo-root duplicate copies this comment used to reference (from an
# earlier migration, see PR #26) are gone, each with its own 301 in
# _redirects (Search Console cleanup) -- but picking a "clean" URL on top
# of that single real path is still its own naming decision, not a
# mechanical mapping, so it's left for a follow-up rather than guessed here.

# Stop the Netlify subdomain from being a second, uncanonicalized copy of
# the whole site: any request to the *.netlify.app production hostname
# 301s to the matching page on the real domain. Scoped to that exact
# hostname (an absolute URL in "from"), so it does NOT match deploy
# previews, which get their own auto-generated deploy-preview-<N>--...
# hostname and still need to work for reviewing a PR.
[[redirects]]
  from = "https://vanessa-stoykov-website.netlify.app/*"
  to = "https://vanessastoykov.com.au/:splat"
  status = 301
  force = true

# Cache the favicon/manifest files for a day. Short enough that a future
# redesign of the icon rolls out same-day, long enough to avoid refetching
# them on every page view.
[[headers]]
  for = "/favicon.ico"
  [headers.values]
    Cache-Control = "public, max-age=86400"
[[headers]]
  for = "/favicon.svg"
  [headers.values]
    Cache-Control = "public, max-age=86400"
[[headers]]
  for = "/favicon-16x16.png"
  [headers.values]
    Cache-Control = "public, max-age=86400"
[[headers]]
  for = "/favicon-32x32.png"
  [headers.values]
    Cache-Control = "public, max-age=86400"
[[headers]]
  for = "/apple-touch-icon.png"
  [headers.values]
    Cache-Control = "public, max-age=86400"
[[headers]]
  for = "/icon-192.png"
  [headers.values]
    Cache-Control = "public, max-age=86400"
[[headers]]
  for = "/icon-512.png"
  [headers.values]
    Cache-Control = "public, max-age=86400"
[[headers]]
  for = "/site.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=86400"
