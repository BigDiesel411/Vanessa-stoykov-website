# Netlify config for this static, no-build site (see package.json).
# No [build] section is defined here deliberately — this repo has no
# build step, and Netlify's own dashboard build settings for this site
# are left untouched by this file.

# Explicit pass-throughs for the favicon/manifest files added in the
# "add a favicon" task, so neither this file's own catch-alls below nor
# any future rule added to this file or to _redirects can ever swallow
# them — these four paths must always hit the real static file in the
# repo root, never a rewrite. (Checked: nothing currently in netlify.toml
# or _redirects matches these paths, so this is a safety net, not a fix
# for an active conflict.)
[[redirects]]
  from = "/favicon.ico"
  to = "/favicon.ico"
  status = 200
[[redirects]]
  from = "/favicon.svg"
  to = "/favicon.svg"
  status = 200
[[redirects]]
  from = "/apple-touch-icon.png"
  to = "/apple-touch-icon.png"
  status = 200
[[redirects]]
  from = "/site.webmanifest"
  to = "/site.webmanifest"
  status = 200

# Same explicit pass-through, for the same reason, for the two files a
# search engine looks for by convention: neither must ever be swallowed by
# a catch-all rewrite and served the homepage instead.
[[redirects]]
  from = "/robots.txt"
  to = "/robots.txt"
  status = 200
[[redirects]]
  from = "/sitemap.xml"
  to = "/sitemap.xml"
  status = 200

# The homepage is authored as Homepage.dc.html (this site's "Claude
# Design" canvas pages are all named PageName.dc.html rather than
# index.html), so Netlify's default "serve index.html at /" has nothing
# to serve at the root and shows its default 404. This rewrite (status
# 200, not a redirect) makes "/" transparently serve Homepage.dc.html
# while the visible URL stays "/".
[[redirects]]
  from = "/"
  to = "/Homepage.dc.html"
  status = 200

